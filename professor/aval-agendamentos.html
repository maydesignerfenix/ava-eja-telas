<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agendamentos · Avaliações · AVA EJA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="aval-common.css" />
  <link rel="stylesheet" href="aval-agendamentos.css" />
</head>
<body data-role="professor">
  <div data-chrome="header"></div>

  <main class="container">
    <nav class="breadcrumb" aria-label="Você está em">
      <ol>
        <li><a href="#" aria-label="Início"><img src="../shared/assets/breadcrumb-home.svg" width="24" height="24" alt="" /></a></li>
        <li class="breadcrumb__sep" aria-hidden="true"><img src="../shared/assets/breadcrumb-chevron.svg" width="12.375" height="7.125" alt="" /></li>
        <li class="breadcrumb__parent"><a href="#">Avaliações</a></li>
        <li class="breadcrumb__sep" aria-hidden="true"><img src="../shared/assets/breadcrumb-chevron.svg" width="12.375" height="7.125" alt="" /></li>
        <li class="breadcrumb__current" aria-current="page">Agendamentos e Correções</li>
      </ol>
    </nav>

    <div class="aval-heading">
      <h1>Agendamentos e Correções</h1>
    </div>

    <nav class="tabs tabs--2" aria-label="Agendamentos e Correções">
      <a class="tab is-active" href="aval-agendamentos.html" aria-current="page">Agendamentos</a>
      <a class="tab" href="aval-correcoes.html">Correções</a>
    </nav>

    <section class="scheduled" aria-labelledby="scheduled-title">
      <div class="page-title">
        <div class="page-title__text">
          <h2 id="scheduled-title" class="scheduled__title">Atividades agendadas</h2>
          <p>Atividades agendadas para todas as suas turmas</p>
        </div>
        <button class="btn btn--primary" type="button">AGENDAR ATIVIDADE</button>
      </div>

      <div class="list-area">
        <div class="aval-toolbar">
          <h3 class="aval-toolbar__count" id="count" aria-live="polite">1000 atividades agendadas</h3>
          <div class="aval-toolbar__controls">
            <label class="search">
              <span class="visually-hidden">Buscar atividades agendadas</span>
              <img class="search__icon" src="../shared/assets/search.svg" width="18" height="18" alt="" />
              <input id="search" type="search" placeholder="buscar" autocomplete="off" />
            </label>
            <button class="btn btn--outline-md" id="filter-toggle" type="button" aria-expanded="false" aria-controls="filters">
              <img src="../shared/assets/filter-alt.svg" width="31.2" height="31.2" alt="" />
              Filtrar
            </button>
          </div>
          <label class="sort-select only-mobile">
            <span class="visually-hidden">Ordenação</span>
            <select id="sort-select">
              <option value="" selected>Ordenação</option>
              <option value="title:asc">Atividade (A–Z)</option>
              <option value="title:desc">Atividade (Z–A)</option>
              <option value="turma:asc">Turma (A–Z)</option>
              <option value="start:asc">Período (mais antigo)</option>
              <option value="start:desc">Período (mais recente)</option>
            </select>
            <img src="../shared/assets/mobile-select-arrow.svg" width="24" height="24" alt="" />
          </label>
        </div>

        <div class="filters" id="filters" hidden>
          <label class="filters__field">
            <span class="filters__label">Situação</span>
            <span class="select">
              <select id="filter-kind">
                <option value="">Todas</option>
                <option value="created">Publicadas</option>
                <option value="draft">Rascunhos</option>
              </select>
              <img src="../shared/assets/select-arrow-drop-down.svg" width="24" height="24" alt="" />
            </span>
          </label>
          <label class="filters__field filters__check">
            <input type="checkbox" id="filter-fav" />
            <span>Somente favoritas</span>
          </label>
        </div>

        <div class="table" role="region" aria-label="Lista de atividades agendadas">
          <div class="table__head only-desktop">
            <span class="col-spacer"></span>
            <button class="th th--title" type="button" data-sort="title">ATIVIDADES AGENDADAS <span class="sort-icon" aria-hidden="true"><img src="../shared/assets/sort-up.svg" width="24" height="24" alt="" /><img src="../shared/assets/sort-down.svg" width="24" height="24" alt="" /></span></button>
            <button class="th th--turma" type="button" data-sort="turma">TURMA <span class="sort-icon" aria-hidden="true"><img src="../shared/assets/sort-up.svg" width="24" height="24" alt="" /><img src="../shared/assets/sort-down.svg" width="24" height="24" alt="" /></span></button>
            <button class="th th--period" type="button" data-sort="start">PERÍODO <span class="sort-icon" aria-hidden="true"><img src="../shared/assets/sort-up.svg" width="24" height="24" alt="" /><img src="../shared/assets/sort-down.svg" width="24" height="24" alt="" /></span></button>
            <span class="th th--progress">RESPONDIDAS</span>
            <span class="th th--actions">AÇÕES</span>
          </div>
          <ul class="activity-list" id="activity-list"></ul>
          <p class="empty-state" id="empty-state" hidden>Nenhuma atividade encontrada.</p>
        </div>

        <div class="pagination">
          <label class="page-size">
            <span class="visually-hidden">Itens por página</span>
            <select>
              <option selected>12</option>
              <option>24</option>
              <option>48</option>
            </select>
            <img src="../shared/assets/select-arrow-drop-down.svg" width="24" height="24" alt="" />
          </label>
          <nav class="pages" aria-label="Paginação">
            <button class="page-btn page-btn--icon" type="button" data-page="prev" aria-label="Página anterior"><img src="../shared/assets/chevron-left.svg" width="16" height="16" alt="" /></button>
            <button class="page-btn is-active" type="button" data-page="1" aria-current="page">1</button>
            <button class="page-btn" type="button" data-page="2">2</button>
            <button class="page-btn" type="button" data-page="3">3</button>
            <button class="page-btn page-btn--icon" type="button" data-page="next" aria-label="Próxima página"><img src="../shared/assets/chevron-right.svg" width="16" height="16" alt="" /></button>
          </nav>
        </div>
      </div>
    </section>
  </main>

  <div data-chrome="footer"></div>

  <script src="../shared/chrome.js"></script>
  <script src="aval-agendamentos.js"></script>
</body>
</html>
