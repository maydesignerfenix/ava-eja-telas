<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planejar estudos · Atividades · AVA EJA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="est-acomp.css" />
  <link rel="stylesheet" href="planejar-estudos.css" />
</head>
<body data-role="estudante">
  <div data-chrome="header"></div>

  <main class="container est-page plan-page">
    <nav class="breadcrumb" aria-label="Você está em">
      <ol>
        <li><a href="#" aria-label="Início"><img src="../shared/assets/breadcrumb-home.svg" width="24" height="24" alt="" /></a></li>
        <li class="breadcrumb__sep" aria-hidden="true"><img src="../shared/assets/breadcrumb-chevron.svg" width="12.375" height="7.125" alt="" /></li>
        <li><a href="#">Turmas</a></li>
        <li class="breadcrumb__sep" aria-hidden="true"><img src="../shared/assets/breadcrumb-chevron.svg" width="12.375" height="7.125" alt="" /></li>
        <li class="breadcrumb__current" aria-current="page">Anos Finais - AF</li>
      </ol>
    </nav>

    <section class="class-header plan-class-header" aria-label="Turma">
      <div class="class-header__titles">
        <p class="class-header__title">Anos Finais - AF</p>
        <p class="class-header__subtitle">EJA</p>
      </div>
      <div class="class-header__actions">
        <button class="btn btn--outline-sm btn--icon" type="button" aria-label="Notificações da turma">
          <img src="../shared/assets/btn-notifications.svg" width="20" height="20" alt="" />
        </button>
        <a class="btn btn--outline-sm" href="boletim.html">Relatórios</a>
        <button class="btn btn--outline-sm" type="button">Arquivos</button>
        <button class="btn btn--outline-sm" type="button">Detalhes da turma</button>
      </div>
    </section>

    <hr class="divider plan-divider" />

    <div class="banner" aria-hidden="true">
      <div class="banner__circle">
        <img class="banner__icon" src="../shared/assets/banner-eja.svg" width="346.122" height="335.864" alt="" />
      </div>
    </div>

    <nav class="tabs plan-tabs" aria-label="Seções da turma">
      <a class="tab" href="#">Conteúdos</a>
      <a class="tab" href="#">Mural</a>
      <a class="tab is-active" href="planejar-estudos.html" aria-current="page">Atividades</a>
    </nav>

    <section class="plan" aria-labelledby="plan-title">
      <div class="plan__head">
        <h1 id="plan-title">Atividades</h1>
        <div class="plan__toolbar">
          <p class="plan__total"><span class="only-desktop">1000 atividades</span><span class="only-mobile">1000 atividades agendadas</span></p>
          <label class="search plan__search">
            <span class="visually-hidden">Buscar em todas as atividades</span>
            <img class="search__icon" src="../shared/assets/search.svg" width="18" height="18" alt="" />
            <input id="search-all" type="search" placeholder="buscar" autocomplete="off" />
          </label>
          <button class="btn btn--outline-md plan__filter" type="button" id="open-filter" aria-haspopup="dialog">
            <img src="../shared/assets/filter-alt.svg" width="31.2" height="31.2" alt="" />
            Filtrar
          </button>
          <label class="sort-select only-mobile">
            <span class="visually-hidden">Ordenação</span>
            <select id="sort-select">
              <option value="" selected>Ordenação</option>
              <option value="title:asc">Atividade (A–Z)</option>
              <option value="title:desc">Atividade (Z–A)</option>
              <option value="status:asc">Status</option>
            </select>
            <img src="../shared/assets/mobile-select-arrow.svg" width="24" height="24" alt="" />
          </label>
        </div>
      </div>

      <div class="plan__list-area">
        <div class="plan__list-toolbar only-desktop">
          <h2 class="plan__count" id="plan-count" aria-live="polite">87 Atividades</h2>
          <label class="search plan__list-search">
            <span class="visually-hidden">Buscar nesta lista</span>
            <img class="search__icon" src="../shared/assets/search.svg" width="18" height="18" alt="" />
            <input id="search-list" type="search" placeholder="buscar" autocomplete="off" />
          </label>
        </div>
        <ul class="plan-list" id="plan-list"></ul>
        <p class="empty-state est-small" id="empty-state" hidden>Nenhuma atividade encontrada.</p>
      </div>

      <div class="pagination plan-pagination">
        <label class="page-size">
          <span class="visually-hidden">Itens por página</span>
          <select>
            <option selected>12</option>
            <option>24</option>
            <option>48</option>
          </select>
          <img src="../shared/assets/select-arrow-drop-down.svg" width="24" height="24" alt="" />
        </label>
        <nav class="pages" aria-label="Paginação">
          <button class="page-btn page-btn--icon" type="button" data-page="prev" aria-label="Página anterior"><img src="../shared/assets/chevron-left.svg" width="16" height="16" alt="" /></button>
          <button class="page-btn is-active" type="button" data-page="1" aria-current="page">1</button>
          <button class="page-btn" type="button" data-page="2">2</button>
          <button class="page-btn" type="button" data-page="3">3</button>
          <button class="page-btn page-btn--icon" type="button" data-page="next" aria-label="Próxima página"><img src="../shared/assets/chevron-right.svg" width="16" height="16" alt="" /></button>
        </nav>
      </div>
    </section>
  </main>

  <dialog class="modal plan-filter-dialog" id="filter-dialog" aria-labelledby="filter-title">
    <form method="dialog" class="plan-filter-dialog__body">
      <h2 class="est-h2" id="filter-title">Filtrar atividades</h2>
      <label class="field">
        <span class="field__label">Status</span>
        <span class="select">
          <select id="filter-status">
            <option value="" selected>Todos os status</option>
            <option value="nao-iniciada">Não iniciada</option>
            <option value="em-correcao">Em correção</option>
            <option value="corrigido">Corrigido</option>
          </select>
          <img src="../shared/assets/mobile-select-arrow.svg" width="24" height="24" alt="" />
        </span>
      </label>
      <div class="est-actions">
        <button class="btn btn--outline-sm" type="submit" value="clear">LIMPAR</button>
        <button class="btn btn--primary-sm" type="submit" value="apply">APLICAR</button>
      </div>
    </form>
  </dialog>

  <div data-chrome="footer"></div>

  <script src="../shared/chrome.js"></script>
  <script src="planejar-estudos.js"></script>
</body>
</html>
